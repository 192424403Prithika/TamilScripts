services:
  # -------------------------------------------------------------
  # Backend Web Service (FastAPI + Python 3.11 + Deep Learning)
  # -------------------------------------------------------------
  - type: web
    name: tamilscript-ai-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "false"

  # -------------------------------------------------------------
  # Frontend Static Site (React 18 + Vite + TailwindCSS)
  # -------------------------------------------------------------
  - type: web
    name: tamilscript-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://tamilscript-ai-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
