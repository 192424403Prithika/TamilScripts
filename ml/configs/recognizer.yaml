model:
  name: LightweightTamilRecognizer
  num_classes: 156
  in_channels: 1
  input_size: [64, 64]
  temperature: 1.0

training:
  batch_size: 64
  epochs: 30
  quick_epochs: 5
  lr: 0.001
  min_lr: 0.00001
  weight_decay: 0.01
  label_smoothing: 0.1
  optimizer: AdamW
  scheduler: CosineAnnealingLR
  mixed_precision: true
  seed: 42

data:
  dataset_path: ml/data/processed/tamil_dataset.npz
  unicode_map: ml/data/unicode_map.json
  num_workers: 2

export:
  onnx_path: ml/export/saved_models/recognizer.onnx
  tfjs_dir: frontend/public/models/recognizer
  quantization: float16
